<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/water_meter.css" />
    <link rel="stylesheet" href="/static/hourglass.css" />
  </head>
  <body>
    <!-- Invisible trigger for offset controls -->
    <div id="offset-trigger"></div>

    <!-- Buttons for live offset changes -->
    <div id="offset-controls">
      <button data-offset-ms="-86400000">-1d</button>
      <button data-offset-ms="-21600000">-6h</button>
      <button data-offset-ms="-10800000">-3h</button>
      <button data-offset-ms="reset">now</button>
      <button data-offset-ms="10800000">+3h</button>
      <button data-offset-ms="21600000">+6h</button>
      <button data-offset-ms="86400000">+1d</button>
      <span class="controls-sep">|</span>
      <button data-hourglass="15">15m</button>
      <button data-hourglass="5">5m</button>
      <button data-hourglass="1">1m</button>
      <button data-hourglass="stop">off</button>
      <span class="controls-sep">|</span>
      <button data-action="test-announce">Announce</button>
      <button id="dinner-bell" class="dinner-bell" aria-label="Ring dinner bell" title="Ring dinner bell">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 0 0-5-5.9V4a1 1 0 1 0-2 0v1.1A6 6 0 0 0 6 11v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
          <path d="M9 17a3 3 0 0 0 6 0" />
        </svg>
      </button>
      <button data-action="open-lights" title="Open lighting controls">💡 Lights</button>
      <button data-action="close">&times;</button>
    </div>

    <div class="clock-container">
      <div id="time" class="time">
        <span id="time-string" class="flip-time"></span>
        <div class="ampm-stack">
          <span id="am-indicator" class="inactive">AM</span>
          <span id="pm-indicator" class="active">PM</span>
        </div>
      </div>
      <!-- This element's class will be changed by the script -->
      <div id="date-display" class="date">Monday, 1 January</div>
      <div id="holiday-info" class="date" style="display:none">Holiday Info</div>
      <div id="omer-info" class="omer" style="display:none"></div>
    </div>

    <!-- This element will show Shabbat start/end times -->
    <div id="shabbat-time-info"></div>

    <!-- Stock tickers (left side) -->
    <div id="stock-tickers"></div>

    <!-- Bottom weather bar: current + forecast -->
    <div id="weather-bar">
      <div id="weather-info"></div>
      <div id="weather-forecast"></div>
    </div>

    <!-- Lighting controls button (lower-right, above water reading) -->
    <button id="lighting-button" class="lighting-trigger" aria-label="Open lighting controls" title="Lighting Controls">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 18h6m-4 3h2m-4-6a6.5 6.5 0 1 1 6-4.5c0 2-1 3.5-2 4.5H9z" />
      </svg>
    </button>

    <!-- Water meter reading (lower-right) -->
    <div id="water-reading">-- m³</div>

    <!-- Hourglass countdown (right edge) -->
    <div id="hourglass-container">
      <canvas id="hourglass-canvas"></canvas>
      <div id="hourglass-countdown"></div>
    </div>

    <!-- Water usage graph overlay -->
    <div id="water-overlay">
      <div id="water-graph-container">
        <canvas id="water-graph"></canvas>
        <button id="water-close">&times;</button>
      </div>
    </div>

    <!-- Image history gallery overlay -->
    <div id="gallery-overlay">
      <button id="gallery-close">&times;</button>
      <div id="gallery-grid"></div>
    </div>

    <!-- Gallery lightbox (maximized single image) -->
    <div id="gallery-lightbox">
      <img id="gallery-lightbox-img" src="" alt="" />
    </div>

    <!-- Lighting drawer overlay -->
    <div id="lighting-overlay">
      <div class="lighting-container">
        <div class="lighting-header">
          <div class="lighting-title-group">
            <svg class="lighting-header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 18h6m-4 3h2m-4-6a6.5 6.5 0 1 1 6-4.5c0 2-1 3.5-2 4.5H9z" />
            </svg>
            <span class="lighting-title">Lighting &amp; Scenes</span>
          </div>
          <div class="lighting-header-right">
            <span id="lighting-auto-close" class="lighting-auto-close">Auto-close in 30s</span>
            <button id="lighting-close" class="lighting-close-btn" aria-label="Close lighting drawer">&times;</button>
          </div>
        </div>

        <div id="lighting-content">
          <!-- Quick actions -->
          <div class="lighting-section-title">QUICK ACTIONS</div>
          <div class="lighting-quick-actions">
            <button id="lighting-all-off-btn" class="quick-action-btn all-off-btn" title="Turn off all lights">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>All Off</span>
            </button>
            <div id="lighting-scenes-list" class="scenes-list"></div>
          </div>

          <!-- Lights & dimmers list -->
          <div class="lighting-section-title">LIGHTS &amp; DIMMERS</div>
          <div id="lighting-devices-list" class="devices-list"></div>
        </div>

        <div id="lighting-status-msg" class="lighting-status-msg" style="display:none"></div>
      </div>
    </div>

    <script>
      // --- DOM elements ---
      const timeStringEl = document.getElementById("time-string");
      const dateDisplayEl = document.getElementById("date-display");
      const amIndicator = document.getElementById("am-indicator");
      const pmIndicator = document.getElementById("pm-indicator");
      const dinnerBellEl = document.getElementById("dinner-bell");
      const shabbatInfoEl = document.getElementById("shabbat-time-info");
      const holidayInfoEl = document.getElementById("holiday-info");
      const omerInfoEl = document.getElementById("omer-info");

      // Omer toggle state: false = English, true = Hebrew
      let omerShowHebrew = false;
      const weatherInfoEl = document.getElementById("weather-info");
      const offsetControlsEl = document.getElementById("offset-controls");
      const offsetTriggerEl = document.getElementById("offset-trigger");

      // --- State ---
      let timeOffsetMs = 0;
      let lastBackgroundImage = null;
      let prevTimeStr = "";

      // --- Weather SVG icons (WMO code mapping) ---
      function getWeatherIcon(code) {
        if (code === 0)
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
        if (code >= 1 && code <= 3)
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>';
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="19" x2="12" y2="21"></line><line x1="16" y1="19" x2="16" y2="21"></line></svg>';
        if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86))
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="19" x2="12" y2="21"></line><line x1="16" y1="19" x2="16" y2="21"></line><line x1="10" y1="15" x2="14" y2="15"></line><line x1="9" y1="12" x2="11" y2="12"></line><line x1="13" y1="12" x2="15" y2="12"></line></svg>';
        if (code >= 95 && code <= 99)
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16.5c0-1.68-1.34-3-3-3h-1.26a8 8 0 1 0-11.48 0H4c-1.66 0-3 1.32-3 3s1.34 3 3 3h14c1.66 0 3-1.32 3-3z"></path><polyline points="13 11 9 17 15 17 11 23"></polyline></svg>';
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>';
      }

      // --- Clock tick (runs every second) ---
      function updateClock() {
        const now = new Date(Date.now() + timeOffsetMs);
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        const isAm = hours < 12;
        hours = hours % 12 || 12;
        const timeStr = hours + ":" + minutes + ":" + seconds;

        updateFlipDigits(timeStr);
        prevTimeStr = timeStr;

        if (isAm) {
          amIndicator.className = "active";
          pmIndicator.className = "inactive";
        } else {
          amIndicator.className = "inactive";
          pmIndicator.className = "active";
        }

        // Date
        const dateOptions = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
        dateDisplayEl.textContent = new Intl.DateTimeFormat("en-US", dateOptions).format(now);
      }

      function updateFlipDigits(timeStr) {
        const container = timeStringEl;

        // Rebuild cells when string length changes (e.g. 9:59 -> 10:00)
        if (timeStr.length !== prevTimeStr.length) {
          container.innerHTML = "";
          for (let i = 0; i < timeStr.length; i++) {
            const ch = timeStr[i];
            if (ch === ":") {
              const sep = document.createElement("span");
              sep.className = "flip-separator";
              sep.textContent = ":";
              container.appendChild(sep);
            } else {
              const cell = document.createElement("span");
              cell.className = "flip-cell";
              cell.innerHTML =
                '<span class="flip-card">' +
                '  <span class="flip-front">' + ch + "</span>" +
                '  <span class="flip-back"></span>' +
                "</span>";
              container.appendChild(cell);
            }
          }
          return;
        }

        // Animate only changed digits
        const cells = container.children;
        for (let i = 0; i < timeStr.length; i++) {
          if (timeStr[i] === prevTimeStr[i]) continue;
          if (timeStr[i] === ":") continue;

          const card = cells[i].querySelector(".flip-card");
          if (!card || card.classList.contains("flipping")) continue;

          const front = card.querySelector(".flip-front");
          const back = card.querySelector(".flip-back");
          back.textContent = timeStr[i];
          card.classList.add("flipping");

          const newVal = timeStr[i];
          card.addEventListener(
            "animationend",
            function () {
              card.classList.remove("flipping");
              front.textContent = newVal;
            },
            { once: true }
          );
        }
      }

      // --- Fetch state from server and apply ---
      async function fetchState() {
        try {
          const resp = await fetch("/api/state");
          if (!resp.ok) return;
          const state = await resp.json();
          applyState(state);
        } catch (e) {
          console.error("Failed to fetch state:", e);
        }
      }

      function applyState(state) {
        // Weather
        if (state.weather) {
          const w = state.weather;
          weatherInfoEl.innerHTML =
            getWeatherIcon(w.code) +
            '<div class="weather-details">' +
            '  <span class="current-temp">' + w.temp + "°C</span>" +
            '  <div class="high-low-temp">' +
            "    <span>H: " + w.high + "°</span>" +
            "    <span>L: " + w.low + "°</span>" +
            "  </div>" +
            "</div>";
          // Forecast
          var fcEl = document.getElementById("weather-forecast");
          if (w.forecast && w.forecast.length) {
            var html = "";
            for (var i = 0; i < w.forecast.length; i++) {
              var f = w.forecast[i];
              var hour = new Date(f.time).getHours();
              var ampm = hour >= 12 ? "PM" : "AM";
              var h12 = hour % 12 || 12;
              html += '<div class="forecast-item">' +
                '<span class="forecast-time">' + h12 + ampm + '</span>' +
                getWeatherIcon(f.code) +
                '<span class="forecast-temp">' + f.temp + '°</span>' +
                '</div>';
            }
            fcEl.innerHTML = html;
            fcEl.style.display = "flex";
          } else {
            fcEl.innerHTML = "";
            fcEl.style.display = "none";
          }
        } else {
          weatherInfoEl.innerHTML = "<span>--°C</span>";
          document.getElementById("weather-forecast").style.display = "none";
        }

        // Stocks
        if (state.stocks && state.stocks.length) {
          var stockEl = document.getElementById("stock-tickers");
          var html = "";
          for (var i = 0; i < state.stocks.length; i++) {
            var s = state.stocks[i];
            var sign = s.change_pct >= 0 ? "+" : "";
            var cls = s.change_pct >= 0 ? "stock-up" : "stock-down";
            html += '<div class="stock-item">' +
              '<span class="stock-symbol">' + s.symbol + '</span>' +
              '<span class="stock-price">' + (s.price != null ? s.price.toFixed(2) : '--') + '</span>' +
              '<span class="stock-change ' + cls + '">' + sign + s.change_pct.toFixed(2) + '%</span>' +
              '</div>';
          }
          stockEl.innerHTML = html;
          stockEl.style.display = "flex";
        }

        // Holiday info
        if (state.holiday_name) {
          holidayInfoEl.textContent = state.holiday_name;
          holidayInfoEl.style.display = "block";
        } else {
          holidayInfoEl.style.display = "none";
        }

        // Omer count
        if (state.omer_count) {
          omerInfoEl.dataset.en = state.omer_count.en;
          omerInfoEl.dataset.he = state.omer_count.he;
          omerInfoEl.textContent = omerShowHebrew ? state.omer_count.he : state.omer_count.en;
          omerInfoEl.style.display = "block";
        } else {
          omerInfoEl.style.display = "none";
        }

        // Date display class
        dateDisplayEl.className = state.display_class || "date";

        // Shabbat background
        if (state.show_shabbat_background) {
          document.body.classList.add("shabbat-background");
        } else {
          document.body.classList.remove("shabbat-background");
        }

        // Candle lighting / Havdalah
        if (state.candle_lighting) {
          shabbatInfoEl.textContent = "Candle Lighting: " + state.candle_lighting;
          shabbatInfoEl.style.display = "block";
        } else if (state.havdalah) {
          shabbatInfoEl.textContent = "Havdalah: " + state.havdalah;
          shabbatInfoEl.style.display = "block";
        } else {
          shabbatInfoEl.style.display = "none";
        }

        // Background image
        if (state.background_image && state.background_image !== lastBackgroundImage) {
          lastBackgroundImage = state.background_image;
          document.body.style.backgroundImage =
            'linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("' +
            state.background_image + '")';
          document.body.style.backgroundPosition = "center center";
          document.body.style.backgroundRepeat = "no-repeat";
          document.body.style.backgroundSize = "cover";
        } else if (!state.background_image) {
          document.body.style.backgroundImage = "";
          lastBackgroundImage = null;
        }

        // Hourglass countdown (skip if debug override active)
        if (window.hourglassUpdate && !window.hourglassDebug) {
          window.hourglassUpdate(state.next_event_epoch || null);
        }
      }

      // --- Offset controls ---
      offsetTriggerEl.addEventListener("click", function () {
        offsetControlsEl.classList.add("visible");
      });

      offsetControlsEl.addEventListener("click", async function (event) {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.action === "close") {
          offsetControlsEl.classList.remove("visible");
          return;
        }

        if (button.dataset.action === "open-lights") {
          openLightingDrawer();
          return;
        }

        // Hourglass debug buttons
        if (button.dataset.hourglass) {
          if (button.dataset.hourglass === "stop") {
            window.hourglassDebug = false;
            window.hourglassUpdate(null);
          } else {
            var mins = parseInt(button.dataset.hourglass, 10);
            var epoch = Date.now() / 1000 + mins * 60;
            window.hourglassDebug = true;
            window.hourglassUpdate(epoch);
          }
          return;
        }

        if (button.dataset.action === "test-announce") {
          button.disabled = true;
          button.textContent = "🔊 ...";
          try {
            const r = await fetch("/api/test-announcement", { method: "POST" });
            const j = await r.json();
            button.textContent = j.ok ? "🔊 ✓" : "🔊 ✗";
          } catch (e) {
            button.textContent = "🔊 ✗";
          }
          setTimeout(() => { button.textContent = "🔊 Test"; button.disabled = false; }, 3000);
          return;
        }

        const offsetMs = button.dataset.offsetMs;
        let body;
        if (offsetMs === "reset") {
          body = { action: "reset" };
        } else {
          body = { offset_ms: parseInt(offsetMs, 10) };
        }

        try {
          const resp = await fetch("/api/offset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const result = await resp.json();
          timeOffsetMs = result.offset_ms;

          // Update the "now" button appearance
          const nowBtn = offsetControlsEl.querySelector('[data-offset-ms="reset"]');
          if (nowBtn) {
            if (timeOffsetMs !== 0) {
              nowBtn.classList.add("offset-active");
            } else {
              nowBtn.classList.remove("offset-active");
            }
          }

          updateClock();
          fetchState();
        } catch (e) {
          console.error("Failed to update offset:", e);
        }
      });

      // --- Omer click to toggle English/Hebrew ---
      omerInfoEl.addEventListener("click", function () {
        omerShowHebrew = !omerShowHebrew;
        omerInfoEl.textContent = omerShowHebrew ? omerInfoEl.dataset.he : omerInfoEl.dataset.en;
      });

      // --- Dinner bell ---
      dinnerBellEl.addEventListener("click", async function () {
        if (dinnerBellEl.disabled) return;
        dinnerBellEl.disabled = true;
        dinnerBellEl.classList.remove("success", "error");
        dinnerBellEl.classList.add("pending");
        try {
          const resp = await fetch("/api/dinner-bell", { method: "POST" });
          const result = await resp.json();
          dinnerBellEl.classList.remove("pending");
          dinnerBellEl.classList.add(result.ok ? "success" : "error");
        } catch (err) {
          dinnerBellEl.classList.remove("pending");
          dinnerBellEl.classList.add("error");
          console.error("Dinner bell failed:", err);
        }
        setTimeout(function () {
          dinnerBellEl.classList.remove("pending", "success", "error");
          dinnerBellEl.disabled = false;
        }, 3000);
      });

      // --- Image history gallery ---
      const galleryOverlayEl = document.getElementById("gallery-overlay");
      const galleryCloseEl = document.getElementById("gallery-close");
      const galleryGridEl = document.getElementById("gallery-grid");
      const galleryLightboxEl = document.getElementById("gallery-lightbox");
      const galleryLightboxImgEl = document.getElementById("gallery-lightbox-img");

      const GALLERY_LONG_PRESS_MS = 600;
      let galleryLongPressTimer = null;
      let galleryLongPressX = 0;
      let galleryLongPressY = 0;

      // Suppress the browser context menu that appears on long-press (touch).
      document.body.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function isInteractiveTarget(el) {
        return !!el.closest("button, a, input, select, #offset-trigger, #water-reading, #omer-info, #gallery-overlay, #gallery-lightbox, #lighting-overlay, #lighting-button");
      }

      function startLongPress(e) {
        if (isInteractiveTarget(e.target)) return;
        const pt = e.touches ? e.touches[0] : e;
        galleryLongPressX = pt.clientX;
        galleryLongPressY = pt.clientY;
        galleryLongPressTimer = setTimeout(openGallery, GALLERY_LONG_PRESS_MS);
      }

      function cancelLongPress(e) {
        if (!galleryLongPressTimer) return;
        if (e && e.type === "mousemove") {
          // Only cancel mouse moves that travel more than 5px (allow finger resting).
          const pt = e;
          const dx = pt.clientX - galleryLongPressX;
          const dy = pt.clientY - galleryLongPressY;
          if (dx * dx + dy * dy <= 25) return;
        }
        clearTimeout(galleryLongPressTimer);
        galleryLongPressTimer = null;
      }

      document.body.addEventListener("touchstart", startLongPress, { passive: true });
      document.body.addEventListener("touchend", cancelLongPress);
      document.body.addEventListener("touchmove", cancelLongPress, { passive: true });
      document.body.addEventListener("mousedown", startLongPress);
      document.body.addEventListener("mouseup", cancelLongPress);
      document.body.addEventListener("mousemove", cancelLongPress);

      async function openGallery() {
        galleryLongPressTimer = null;
        galleryGridEl.innerHTML = "";
        galleryOverlayEl.classList.add("visible");
        try {
          const resp = await fetch("/api/images/history");
          if (!resp.ok) return;
          const data = await resp.json();
          if (!data.images || !data.images.length) {
            galleryGridEl.innerHTML = '<p class="gallery-empty">No historical images yet.</p>';
            return;
          }
          data.images.forEach(function (url) {
            const img = document.createElement("img");
            img.className = "gallery-thumb";
            img.src = url;
            img.alt = "";
            img.addEventListener("click", function (e) {
              e.stopPropagation();
              openLightbox(url);
            });
            galleryGridEl.appendChild(img);
          });
        } catch (err) {
          console.error("Failed to load image history:", err);
        }
      }

      function closeGallery() {
        galleryOverlayEl.classList.remove("visible");
      }

      function openLightbox(url) {
        galleryLightboxImgEl.src = url;
        galleryLightboxEl.classList.add("visible");
      }

      function closeLightbox() {
        galleryLightboxEl.classList.remove("visible");
      }

      galleryCloseEl.addEventListener("click", function (e) {
        e.stopPropagation();
        closeGallery();
      });

      galleryLightboxEl.addEventListener("click", closeLightbox);

      // --- Lutron lighting drawer ---
      const lightingButtonEl = document.getElementById("lighting-button");
      const lightingOverlayEl = document.getElementById("lighting-overlay");
      const lightingCloseEl = document.getElementById("lighting-close");
      const lightingAutoCloseEl = document.getElementById("lighting-auto-close");
      const lightingScenesListEl = document.getElementById("lighting-scenes-list");
      const lightingDevicesListEl = document.getElementById("lighting-devices-list");
      const lightingAllOffBtn = document.getElementById("lighting-all-off-btn");
      const lightingStatusMsgEl = document.getElementById("lighting-status-msg");

      let lightingAutoCloseTimer = null;
      let lightingAutoCloseSeconds = 30;
      let lightingPollInterval = null;

      function resetLightingAutoClose() {
        lightingAutoCloseSeconds = 30;
        if (lightingAutoCloseEl) {
          lightingAutoCloseEl.textContent = "Auto-close in " + lightingAutoCloseSeconds + "s";
        }
      }

      function startLightingAutoClose() {
        resetLightingAutoClose();
        clearInterval(lightingAutoCloseTimer);
        lightingAutoCloseTimer = setInterval(function () {
          lightingAutoCloseSeconds--;
          if (lightingAutoCloseSeconds <= 0) {
            closeLightingDrawer();
          } else if (lightingAutoCloseEl) {
            lightingAutoCloseEl.textContent = "Auto-close in " + lightingAutoCloseSeconds + "s";
          }
        }, 1000);
      }

      function stopLightingAutoClose() {
        clearInterval(lightingAutoCloseTimer);
        lightingAutoCloseTimer = null;
      }

      lightingOverlayEl.addEventListener("touchstart", resetLightingAutoClose, { passive: true });
      lightingOverlayEl.addEventListener("mousedown", resetLightingAutoClose);
      lightingOverlayEl.addEventListener("input", resetLightingAutoClose);

      async function openLightingDrawer() {
        lightingOverlayEl.classList.add("visible");
        startLightingAutoClose();
        await fetchLightingState();
        clearInterval(lightingPollInterval);
        lightingPollInterval = setInterval(fetchLightingState, 3000);
      }

      function closeLightingDrawer() {
        lightingOverlayEl.classList.remove("visible");
        stopLightingAutoClose();
        clearInterval(lightingPollInterval);
        lightingPollInterval = null;
      }

      lightingButtonEl.addEventListener("click", openLightingDrawer);
      lightingCloseEl.addEventListener("click", closeLightingDrawer);

      async function fetchLightingState() {
        try {
          const resp = await fetch("/api/lutron/state");
          if (!resp.ok) return;
          const data = await resp.json();
          renderLighting(data);
        } catch (e) {
          console.error("Failed to fetch Lutron state:", e);
        }
      }

      function renderLighting(data) {
        if (!data.configured) {
          lightingStatusMsgEl.textContent = "Lutron Caséta is not configured. Add LUTRON_BRIDGE_IP and certificates in config.py.";
          lightingStatusMsgEl.style.display = "block";
          document.getElementById("lighting-content").style.display = "none";
          return;
        }

        if (!data.connected) {
          lightingStatusMsgEl.textContent = "Connecting to Lutron Smart Bridge...";
          lightingStatusMsgEl.style.display = "block";
        } else {
          lightingStatusMsgEl.style.display = "none";
        }
        document.getElementById("lighting-content").style.display = "block";

        const devices = data.devices || [];
        const scenes = data.scenes || [];

        // Update trigger button glow if any light is on
        const anyOn = devices.some(function (d) { return d.is_on; });
        if (anyOn) {
          lightingButtonEl.classList.add("has-lights-on");
        } else {
          lightingButtonEl.classList.remove("has-lights-on");
        }

        // Render scenes
        lightingScenesListEl.innerHTML = "";
        scenes.forEach(function (scene) {
          const btn = document.createElement("button");
          btn.className = "quick-action-btn scene-btn";
          btn.textContent = scene.name;
          btn.addEventListener("click", async function () {
            btn.classList.add("pending");
            try {
              await fetch("/api/lutron/scene", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ scene_id: scene.id }),
              });
              setTimeout(fetchLightingState, 600);
            } finally {
              btn.classList.remove("pending");
            }
          });
          lightingScenesListEl.appendChild(btn);
        });

        // Render devices
        lightingDevicesListEl.innerHTML = "";
        if (!devices.length) {
          lightingDevicesListEl.innerHTML = '<p class="lighting-empty">No controllable lights or switches discovered.</p>';
          return;
        }

        devices.forEach(function (device) {
          const card = document.createElement("div");
          card.className = "device-card" + (device.is_on ? " active" : "");
          card.dataset.deviceId = device.id;

          const mainRow = document.createElement("div");
          mainRow.className = "device-main-row";

          const infoDiv = document.createElement("div");
          infoDiv.className = "device-info";

          const nameSpan = document.createElement("span");
          nameSpan.className = "device-name";
          nameSpan.textContent = device.name;

          const statusSpan = document.createElement("span");
          statusSpan.className = "device-status";
          statusSpan.textContent = device.is_on ? (device.is_dimmable ? device.level + "%" : "On") : "Off";

          infoDiv.appendChild(nameSpan);
          infoDiv.appendChild(statusSpan);

          const toggleBtn = document.createElement("button");
          toggleBtn.className = "device-toggle-btn " + (device.is_on ? "is-on" : "is-off");
          toggleBtn.textContent = device.is_on ? "ON" : "OFF";
          toggleBtn.addEventListener("click", async function () {
            const newLevel = device.is_on ? 0 : 100;
            // Optimistic update
            card.classList.toggle("active", newLevel > 0);
            toggleBtn.className = "device-toggle-btn " + (newLevel > 0 ? "is-on" : "is-off");
            toggleBtn.textContent = newLevel > 0 ? "ON" : "OFF";
            statusSpan.textContent = newLevel > 0 ? (device.is_dimmable ? "100%" : "On") : "Off";
            if (slider) slider.value = String(newLevel);

            await setDeviceLevel(device.id, newLevel);
            setTimeout(fetchLightingState, 500);
          });

          mainRow.appendChild(infoDiv);
          mainRow.appendChild(toggleBtn);
          card.appendChild(mainRow);

          let slider = null;
          if (device.is_dimmable) {
            const dimmerRow = document.createElement("div");
            dimmerRow.className = "device-dimmer-row";

            slider = document.createElement("input");
            slider.type = "range";
            slider.className = "device-slider";
            slider.min = "0";
            slider.max = "100";
            slider.value = String(device.level || 0);

            let debounceTimer = null;
            slider.addEventListener("input", function () {
              const val = parseInt(slider.value, 10);
              statusSpan.textContent = val > 0 ? val + "%" : "Off";
              card.classList.toggle("active", val > 0);
              toggleBtn.className = "device-toggle-btn " + (val > 0 ? "is-on" : "is-off");
              toggleBtn.textContent = val > 0 ? "ON" : "OFF";

              clearTimeout(debounceTimer);
              debounceTimer = setTimeout(function () {
                setDeviceLevel(device.id, val);
              }, 250);
            });

            const presetsDiv = document.createElement("div");
            presetsDiv.className = "dimmer-presets";
            [25, 50, 75, 100].forEach(function (lvl) {
              const pBtn = document.createElement("button");
              pBtn.className = "preset-btn";
              pBtn.textContent = lvl + "%";
              pBtn.addEventListener("click", async function () {
                slider.value = String(lvl);
                statusSpan.textContent = lvl + "%";
                card.classList.add("active");
                toggleBtn.className = "device-toggle-btn is-on";
                toggleBtn.textContent = "ON";
                await setDeviceLevel(device.id, lvl);
                setTimeout(fetchLightingState, 500);
              });
              presetsDiv.appendChild(pBtn);
            });

            dimmerRow.appendChild(slider);
            dimmerRow.appendChild(presetsDiv);
            card.appendChild(dimmerRow);
          }

          lightingDevicesListEl.appendChild(card);
        });
      }

      async function setDeviceLevel(deviceId, level) {
        try {
          await fetch("/api/lutron/set", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device_id: deviceId, level: level }),
          });
        } catch (e) {
          console.error("Failed to set level:", e);
        }
      }

      lightingAllOffBtn.addEventListener("click", async function () {
        lightingAllOffBtn.classList.add("pending");
        try {
          await fetch("/api/lutron/set", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "all_off" }),
          });
          setTimeout(fetchLightingState, 600);
        } catch (e) {
          console.error("Failed to turn all off:", e);
        } finally {
          lightingAllOffBtn.classList.remove("pending");
        }
      });

      // --- Initialize ---
      updateClock();
      fetchState();
      fetchLightingState();
      setInterval(updateClock, 1000);
      setInterval(fetchState, 30000);
      setInterval(fetchLightingState, 30000);
    </script>
    <script src="/static/hourglass.js"></script>
    <script src="/static/water_meter.js"></script>
  </body>
</html>
